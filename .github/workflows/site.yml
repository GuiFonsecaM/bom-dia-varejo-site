name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 11,16,21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: base
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser pillow trafilatura

      - name: Buscar notícias novas
        if: github.event_name != 'push'
        continue-on-error: true
        run: python coletar_noticias.py
        env:
          SITE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_REPO: ${{ github.repository }}
          IA_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagens e indicadores
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python coletar_imagens.py
            python coletar_indicadores.py || true
            git add data img 2>/dev/null || git add data || true
            if git diff --cached --quiet; then echo "Nada novo"; exit 0; fi
            git commit -qm "Imagens e indicadores"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "Outro commit entrou no meio, tentando de novo..."; sleep 5
          done
          exit 1

  publicar:
    needs: coletar
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Notificar notícias novas
        continue-on-error: true
        run: python3 notificar.py "${{ needs.coletar.outputs.base }}"
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
