name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 11,16,21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser pillow

      - name: Buscar notícias novas
        if: github.event_name != 'push'
        continue-on-error: true
        run: python coletar_noticias.py
        env:
          SITE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_REPO: ${{ github.repository }}

      - name: Buscar imagens das notícias
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python coletar_imagens.py
            git add data img 2>/dev/null || true
            if git diff --cached --quiet; then echo "Nenhuma imagem nova"; exit 0; fi
            git commit -qm "Imagens das notícias"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "Outro commit entrou no meio, tentando de novo..."; sleep 5
          done
          exit 1

  publicar:
    needs: coletar
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
